<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Session Expired</title>
    <style>
        body { font-family: Arial, sans-serif; background: #2d2824; color: #222; margin: 0; padding: 0; }
        .centered { max-width: 400px; margin: 100px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 32px; text-align: center; }
        .simva-logo { width: 120px; margin-bottom: 24px; }
        .btn { display: inline-block; margin-top: 24px; padding: 12px 32px; background: #f89c3c; color: #fff; border: none; border-radius: 4px; font-size: 16px; text-decoration: none; cursor: pointer; }
        .btn:hover { background: #e07c1b; }
    </style>
</head>
<body>
    <div class="centered">
        <img src="/images/logo_text.png" alt="Simva Logo" class="simva-logo" />
        <h2>Session Expired</h2>
        <p>Your authentication has expired or is invalid.<br>Please log in again to continue.</p>
        <a href="/users/login" class="btn">Go to Login</a>
    </div>
</body>
</html>
